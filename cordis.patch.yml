# dsh-remote-ssh 插件的 Cordis 补丁层
# 当此 bundle 被 profile 列入时，此补丁文件被应用为配置层。
# 它插入插件入口行，让 Loader 加载 src/index.ts。
#
# 加载顺序（later layer wins per row）：
# 1. @deepseek-ai/dsh-base（base 层）
# 2. @deepseek-ai/dsh-web-app 或 @deepseek-ai/dsh-headless（应用层）
# 3. dsh-remote-ssh（本插件层）
# 4. profile 的 cordis.patch.yml
# 5. --patch overlays

- insert:
    - id: remote-ssh
      name: '@deepseek-ai/dsh-remote-ssh'
      config:
        helperDirPath: ../../deepseek-harness/packages/ssh/ssh/lib/bundle
        wsPort: 18900
        wsHost: 127.0.0.1
        hostsFilePath: ~/.dsh/remote-hosts.json
        workspacesFilePath: ~/.dsh/remote-workspaces.json
        reconnect:
          enabled: true
          maxAttempts: 3
          initialDelayMs: 1000
          backoffMultiplier: 2
          maxDelayMs: 10000
