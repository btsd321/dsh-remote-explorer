# dsh-remote-ssh 插件的 Cordis 补丁层
# 当此 bundle 被 profile 列入时，此补丁文件被应用为配置层。
# 它插入插件入口行，让 Loader 加载插件并调用 apply(ctx, config)。
#
# 加载后：
# - ctx.remoteHostController 服务注册
# - 在 dsh webServer 上注册 /remote-ssh 路由（HTTP + WebSocket）
# - 访问 http://127.0.0.1:<dsh-port>/remote-ssh 打开管理页面

# 1. 钉住 directoryPicker 的 browse 交互。
#
# 默认的 directory-picker-auto 会在启动时采样一次宿主环境决定后端：
# Windows/macOS + 回环绑定下它解析为 native（见 directory-picker-auto 的 resolve.ts），
# 而 native 能力只有 pick(signal)——在宿主机屏幕上弹一个操作系统文件对话框，
# 语义上无法浏览远端主机目录。browse 能力才是 list/createDirectory 原语，
# 本插件正是通过接管 browse.list 把目录浏览导向远端。
#
# 所以这里禁用 auto 行，直接挂载 browse 的后端与前端界面（成对挂载，
# 与 directory-picker-auto 自身的做法一致）。这是 web-app bundle 注释
# 里给出的官方做法："Mount -native or -browse directly in an overlay to
# pin the interaction."
- id: directory-picker
  disabled: true

- insert:
    # 后端先落：前端界面依赖它注册的 browse 能力
    - id: remote-ssh-directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: remote-ssh-directory-picker-browse-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# 2. 插件本体
- insert:
    - id: remote-ssh
      name: ./src/index.ts
      config:
        helperDirPath: ../deepseek-harness/packages/ssh/ssh/lib/bundle
        hostsFilePath: ~/.dsh/remote-hosts.json
        workspacesFilePath: ~/.dsh/remote-workspaces.json
        reconnect:
          enabled: true
          maxAttempts: 3
          initialDelayMs: 1000
          backoffMultiplier: 2
          maxDelayMs: 10000
